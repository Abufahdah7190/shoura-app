<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حذف حساب شورى</title><style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:20px;background:#f5f6fa;color:#20283a}main{background:white;padding:24px;border-radius:16px}label,input,button{display:block;width:100%;box-sizing:border-box;margin:12px 0}input,button{padding:12px;border:1px solid #ccd1dc;border-radius:8px}button{background:#a82436;color:white;font-weight:700}small{color:#5d6470}
</style></head><body><main><h1>طلب حذف حساب شورى</h1><p>أدخل بريد الحساب وكلمة مروره للتحقق من ملكيتك. سيُحذف الحساب والمنشورات والرسائل المرتبطة به نهائيًا.</p><form id="delete-form"><label>البريد الإلكتروني<input name="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><button>حذف الحساب والبيانات</button></form><small id="status">لا يمكن التراجع عن الحذف.</small></main><script>
document.querySelector('#delete-form').addEventListener('submit',async e=>{e.preventDefault();const s=document.querySelector('#status');if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1'){s.textContent='الاتصال الآمن مطلوب لإكمال الطلب.';return}if(!confirm('هل تريد حذف الحساب نهائيًا؟'))return;const f=new FormData(e.currentTarget);try{let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:f.get('email'),password:f.get('password')})});if(!r.ok)throw Error('تعذر التحقق من بيانات الدخول.');let a=await r.json();r=await fetch('/api/account/me',{method:'DELETE',headers:{Authorization:`Bearer ${a.accessToken}`}});if(!r.ok)throw Error('تعذر حذف الحساب. حاول مرة أخرى.');e.currentTarget.reset();s.textContent='تم حذف الحساب والبيانات المرتبطة به.'}catch(err){s.textContent=err.message}});
</script></body></html>
